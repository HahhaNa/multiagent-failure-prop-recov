# Tool partition and reversibility labels. external: effect leaves the system (external-world log).
banking:
  read: [get_iban, get_balance, get_most_recent_transactions, get_scheduled_transactions, read_file, get_user_info]
  write:
    send_money: {rev: compensable, external: true}
    schedule_transaction: {rev: reversible}
    update_scheduled_transaction: {rev: reversible}
    update_password: {rev: reversible}
    update_user_info: {rev: reversible}
workspace:
  read: [get_unread_emails, get_sent_emails, get_received_emails, get_draft_emails, search_emails,
         search_contacts_by_name, search_contacts_by_email, get_current_day, search_calendar_events,
         get_day_calendar_events, search_files_by_filename, get_file_by_id, list_files, search_files]
  write:
    send_email: {rev: irreversible, external: true}
    delete_email: {rev: reversible}
    create_calendar_event: {rev: reversible}
    cancel_calendar_event: {rev: reversible}
    reschedule_calendar_event: {rev: reversible}
    add_calendar_event_participants: {rev: reversible}
    append_to_file: {rev: reversible}
    create_file: {rev: reversible}
    delete_file: {rev: reversible}
    share_file: {rev: irreversible, external: true}
slack:
  read: [get_channels, read_channel_messages, read_inbox, get_users_in_channel, get_webpage]
  read_external: [get_webpage]   # a fetch reveals the URL to a third party
  write:
    add_user_to_channel: {rev: reversible}
    send_direct_message: {rev: irreversible, external: true}
    send_channel_message: {rev: irreversible, external: true}
    invite_user_to_slack: {rev: irreversible, external: true}
    remove_user_from_slack: {rev: reversible}
    post_webpage: {rev: irreversible, external: true}
